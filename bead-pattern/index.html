<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼豆图纸工坊</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --ink:#22201C; --muted:#6B665D; --line:#DDD8CE; --accent:#D6457A; --accent-ink:#FFFFFF;
  --font: "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1B1A18; --panel:#25231F; --ink:#EFEBE3; --muted:#A39D92; --line:#3A3731; --accent:#F07AA3; --accent-ink:#1B1A18; color-scheme:dark }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
.wrap{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.controls{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.file{display:block;border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--muted)}
.file input{display:none}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px;display:block}
.stats span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);min-height:36px;padding:6px 12px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.canvasBox{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.canvasBox canvas{display:block}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:middle}
.note{color:var(--muted);font-size:13px}
.out{display:flex;flex-direction:column;gap:18px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>拼豆图纸工坊</h1>
  <p class="sub">上传照片，生成带色号和数量清单的拼豆图纸。全部在本机处理，不上传任何图片。</p>

  <div class="grid">
    <div class="panel controls">
      <label class="file" for="file">点这里选择图片<br><small>建议先裁剪成主体居中的图</small>
        <input id="file" type="file" accept="image/*">
      </label>

      <label class="f" for="width">宽度（颗）
        <small>常见：29（小方板）、50、58（大方板）</small>
        <input id="width" type="number" min="8" max="200" value="29">
      </label>

      <label class="f" for="maxColors">最多使用颜色数
        <small>越少越好拼，也越便宜；照片建议 12–24</small>
        <input id="maxColors" type="number" min="2" max="120" value="16">
      </label>

      <label class="check" for="removeBg"><input id="removeBg" type="checkbox" checked> 去掉纯色背景（按四个角的颜色判断）</label>
      <label class="check" for="smooth"><input id="smooth" type="checkbox" checked> 平滑杂点（照片、毛发推荐打开）</label>
      <label class="f" for="bgTol">背景判断宽松度
        <input id="bgTol" type="range" min="2" max="40" value="14">
      </label>

      <label class="f" for="palette">色卡
        <select id="palette">
          <option value="default">内置示例色卡（58 色，色号为示例）</option>
          <option value="custom">我的色卡（在下方粘贴）</option>
        </select>
      </label>

      <details id="customBox">
        <summary>粘贴自己的品牌色卡</summary>
        <p class="note">每行一个颜色：<code>色号,#十六进制颜色</code>，例如 <code>A1,#FAF5CD</code>。从你买豆子的商家色卡上照抄即可。</p>
        <textarea id="customPal" placeholder="A1,#FAF5CD&#10;A2,#FCFED6&#10;..."></textarea>
      </details>

      <div class="row">
        <button id="run" type="button">生成图纸</button>
        <button id="sample" type="button" class="ghost">用示例图</button>
      </div>
      <p class="note" id="msg"></p>
    </div>

    <div class="out">
      <div class="panel">
        <div class="stats">
          <div><b id="sSize">–</b><span>尺寸（颗）</span></div>
          <div><b id="sTotal">–</b><span>总颗数</span></div>
          <div><b id="sColors">–</b><span>颜色数</span></div>
        </div>
        <div class="tabs" role="group" aria-label="视图">
          <button type="button" data-view="pattern" aria-pressed="true">图纸</button>
          <button type="button" data-view="preview" aria-pressed="false">成品预览</button>
          <button type="button" data-view="orig" aria-pressed="false">原图</button>
        </div>
        <div class="canvasBox"><canvas id="view"></canvas></div>
        <div class="row" style="margin-top:12px">
          <button id="dlPattern" type="button">下载图纸 PNG</button>
          <button id="dlPreview" type="button" class="ghost">下载成品预览</button>
          <button id="dlCsv" type="button" class="ghost">下载用量清单 CSV</button>
        </div>
      </div>

      <div class="panel">
        <h2 style="font-size:17px;margin:0 0 8px">颜色用量</h2>
        <table>
          <thead><tr><th>颜色</th><th>色号</th><th>颗数</th><th>建议备豆（+10%）</th></tr></thead>
          <tbody id="legend"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// 内置示例色卡：色号为本工具自编，正式出图请换成你所用品牌的色卡。
const DEFAULT_PAL = `W01,#FFFFFF
W02,#F4F1E8
W03,#E3DED3
G01,#BDBAB4
G02,#8E8B86
G03,#5E5C59
K01,#2E2D2C
K02,#111111
Y01,#FFF3A3
Y02,#FFE04D
Y03,#F9C21B
Y04,#E8A317
O01,#FFC58F
O02,#FF9A3D
O03,#F2701F
O04,#C9531A
R01,#FFB3B3
R02,#F2555A
R03,#D62B32
R04,#9E1C26
P01,#FFD1E3
P02,#FF8FBC
P03,#E8508E
P04,#B32468
V01,#E3CCF5
V02,#B98BE0
V03,#7E4FB8
V04,#4E2C80
B01,#CDE8FA
B02,#7CC4F0
B03,#2F8FD8
B04,#1E5AA8
B05,#152E66
T01,#BFF0E6
T02,#5CCFBE
T03,#1F9E8F
N01,#D8F2B8
N02,#9AD86A
N03,#4DAA3A
N04,#2C6E2A
S01,#FBE3CF
S02,#F2C9A5
S03,#E0A77E
S04,#C4835A
S05,#8F5A3A
S06,#5E3A26
S07,#3D261A
S08,#A8794F
E01,#F1E8D8
E02,#E6D6BC
E03,#D8C2A0
E04,#C9AD86
E05,#B8976D
E06,#A08060
E07,#86694E
E08,#DCD3C8
E09,#BFB3A5
E10,#9E9284`;

const $ = id => document.getElementById(id);
let srcImg = null, result = null, currentView = 'pattern';

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbToLab([r,g,b]){
  const f=c=>{c/=255;return c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92};
  let R=f(r),G=f(g),B=f(b);
  let x=(R*0.4124+G*0.3576+B*0.1805)/0.95047, y=(R*0.2126+G*0.7152+B*0.0722), z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const g2=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  x=g2(x);y=g2(y);z=g2(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;

function parsePalette(text){
  const out=[];
  for(const line of text.split(/\r?\n/)){
    const m=line.trim().match(/^([^,\s]+)\s*[,，\s]\s*(#?[0-9a-fA-F]{6}|#?[0-9a-fA-F]{3})$/);
    if(m){const rgb=hexToRgb(m[2]);out.push({code:m[1],hex:'#'+m[2].replace('#','').toUpperCase(),rgb,lab:rgbToLab(rgb)});}
  }
  return out;
}

function makeSample(){
  // 示例：一只原创的小橘猫头像
  const c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d');
  x.fillStyle='#FFFFFF';x.fillRect(0,0,400,400);
  x.fillStyle='#F2862E';
  x.beginPath();x.moveTo(95,150);x.lineTo(120,40);x.lineTo(185,105);x.fill();
  x.beginPath();x.moveTo(305,150);x.lineTo(280,40);x.lineTo(215,105);x.fill();
  x.fillStyle='#FFB3C4';
  x.beginPath();x.moveTo(115,130);x.lineTo(127,75);x.lineTo(160,108);x.fill();
  x.beginPath();x.moveTo(285,130);x.lineTo(273,75);x.lineTo(240,108);x.fill();
  x.fillStyle='#F2862E';x.beginPath();x.ellipse(200,215,140,120,0,0,Math.PI*2);x.fill();
  x.fillStyle='#FFF5E8';x.beginPath();x.ellipse(200,265,80,62,0,0,Math.PI*2);x.fill();
  x.fillStyle='#C9531A';
  for(const [sx,sy,w] of [[200,110,14],[172,118,10],[228,118,10]]){x.fillRect(sx-w/2,sy,w,38);}
  x.fillStyle='#2B2422';
  x.beginPath();x.ellipse(150,205,16,22,0,0,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(250,205,16,22,0,0,Math.PI*2);x.fill();
  x.fillStyle='#FFFFFF';x.beginPath();x.arc(156,197,6,0,Math.PI*2);x.fill();x.beginPath();x.arc(256,197,6,0,Math.PI*2);x.fill();
  x.fillStyle='#E8508E';x.beginPath();x.moveTo(188,245);x.lineTo(212,245);x.lineTo(200,258);x.fill();
  x.fillStyle='#FF9FB8';x.beginPath();x.ellipse(110,255,20,12,0,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(290,255,20,12,0,0,Math.PI*2);x.fill();
  const img=new Image();img.src=c.toDataURL();return img;
}

function getPalette(){
  if($('palette').value==='custom'){
    const p=parsePalette($('customPal').value);
    if(p.length<2){msg('我的色卡少于 2 个有效颜色，已改用内置示例色卡。');return parsePalette(DEFAULT_PAL);}
    return p;
  }
  return parsePalette(DEFAULT_PAL);
}
function msg(t){$('msg').textContent=t;}

function generate(){
  if(!srcImg){msg('请先选择图片，或点“用示例图”。');return;}
  const W=Math.max(8,Math.min(200,parseInt($('width').value)||29));
  const H=Math.max(1,Math.round(W*srcImg.naturalHeight/srcImg.naturalWidth));
  const maxC=Math.max(2,parseInt($('maxColors').value)||16);
  const pal=getPalette();
  // 先缩到 4 倍再手动平均，得到更干净的格子颜色
  const k=4, c=document.createElement('canvas');c.width=W*k;c.height=H*k;
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  x.drawImage(srcImg,0,0,W*k,H*k);
  const data=x.getImageData(0,0,W*k,H*k).data;
  const px=[];
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    let r=0,g=0,b=0,a=0;
    for(let dy=0;dy<k;dy++)for(let dx=0;dx<k;dx++){const o=((j*k+dy)*W*k+(i*k+dx))*4;r+=data[o];g+=data[o+1];b+=data[o+2];a+=data[o+3];}
    const n=k*k;px.push([r/n,g/n,b/n,a/n]);
  }
  // 背景：四角平均色
  const corners=[px[0],px[W-1],px[(H-1)*W],px[H*W-1]];
  const bgLab=rgbToLab([0,1,2].map(ch=>corners.reduce((s,p)=>s+p[ch],0)/4));
  const tol=parseInt($('bgTol').value), useBg=$('removeBg').checked;
  const labs=px.map(p=>rgbToLab(p));
  const empty=px.map((p,i)=>p[3]<128||(useBg&&Math.sqrt(d2(labs[i],bgLab))<tol));
  // 背景只去掉与边缘相连的部分，避免误删主体内部同色区域
  if(useBg){
    const keep=new Array(W*H).fill(false), seen=new Array(W*H).fill(false), q=[];
    for(let i=0;i<W;i++){q.push(i,(H-1)*W+i);}for(let j=0;j<H;j++){q.push(j*W,j*W+W-1);}
    while(q.length){const v=q.pop();if(seen[v]||!empty[v])continue;seen[v]=true;keep[v]=true;const i=v%W,j=(v/W)|0;
      if(i>0)q.push(v-1);if(i<W-1)q.push(v+1);if(j>0)q.push(v-W);if(j<H-1)q.push(v+W);}
    for(let v=0;v<W*H;v++)if(px[v][3]>=128)empty[v]=keep[v];
  }
  const nearest=(lab,set)=>{let best=-1,bd=Infinity;for(const idx of set){const dd=d2(lab,pal[idx].lab);if(dd<bd){bd=dd;best=idx;}}return best;};
  const all=pal.map((_,i)=>i);
  const assign=labs.map((l,i)=>empty[i]?-1:nearest(l,all));
  // 限制颜色数：反复把用得最少的颜色并入最接近的颜色
  let used=new Set(assign.filter(a=>a>=0));
  while(used.size>maxC){
    const cnt={};assign.forEach(a=>{if(a>=0)cnt[a]=(cnt[a]||0)+1;});
    let least=null;for(const u of used)if(least===null||cnt[u]<cnt[least])least=u;
    used.delete(least);
    for(let i=0;i<assign.length;i++)if(assign[i]===least)assign[i]=nearest(labs[i],used);
  }
  // 平滑：一格周围 8 格里有 5 格以上是同一颜色，就改成那个颜色，重复两次
  if($('smooth').checked){
    for(let pass=0;pass<2;pass++){
      const prev=assign.slice();
      for(let j=0;j<H;j++)for(let i=0;i<W;i++){
        const v=j*W+i;if(prev[v]<0)continue;const cnt={};
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const y=j+dy,x2=i+dx;if(y<0||y>=H||x2<0||x2>=W)continue;const a=prev[y*W+x2];if(a>=0)cnt[a]=(cnt[a]||0)+1;}
        for(const a in cnt)if(cnt[a]>=5&&+a!==prev[v]){assign[v]=+a;break;}
      }
    }
  }
  const counts={};assign.forEach(a=>{if(a>=0)counts[a]=(counts[a]||0)+1;});
  result={W,H,assign,pal,counts};
  renderStats();renderLegend();draw();
  msg('已生成。图纸里每格写的是色号，每 5 格一条细粗线、每 10 格一条粗线。');
}

function renderStats(){
  const {W,H,counts}=result;
  $('sSize').textContent=W+' × '+H;
  $('sTotal').textContent=Object.values(counts).reduce((a,b)=>a+b,0);
  $('sColors').textContent=Object.keys(counts).length;
}
function sortedColors(){return Object.entries(result.counts).map(([i,n])=>({p:result.pal[i],n})).sort((a,b)=>b.n-a.n);}
function renderLegend(){
  $('legend').innerHTML=sortedColors().map(({p,n})=>`<tr><td><span class="sw" style="background:${p.hex}"></span></td><td>${p.code}</td><td>${n}</td><td>${Math.ceil(n*1.1)}</td></tr>`).join('');
}
function inkFor(rgb){const l=0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2];return l>150?'#222':'#fff';}

function drawPattern(cell){
  const {W,H,assign,pal}=result, m=cell*1.6;
  const legendRows=Math.ceil(sortedColors().length/4);
  const cv=document.createElement('canvas');cv.width=W*cell+m*2;cv.height=H*cell+m*2+legendRows*cell*1.4+cell;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  x.textAlign='center';x.textBaseline='middle';
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    const a=assign[j*W+i],X=m+i*cell,Y=m+j*cell;
    if(a<0){continue;}
    x.fillStyle=pal[a].hex;x.fillRect(X,Y,cell,cell);
    x.fillStyle=inkFor(pal[a].rgb);x.font=`600 ${Math.floor(cell*(pal[a].code.length>3?0.3:0.36))}px system-ui,sans-serif`;
    x.fillText(pal[a].code,X+cell/2,Y+cell/2+1);
  }
  for(let i=0;i<=W;i++){x.strokeStyle=i%10===0?'#222':i%5===0?'#666':'#ccc';x.lineWidth=i%10===0?2:i%5===0?1.3:0.6;x.beginPath();x.moveTo(m+i*cell,m);x.lineTo(m+i*cell,m+H*cell);x.stroke();}
  for(let j=0;j<=H;j++){x.strokeStyle=j%10===0?'#222':j%5===0?'#666':'#ccc';x.lineWidth=j%10===0?2:j%5===0?1.3:0.6;x.beginPath();x.moveTo(m,m+j*cell);x.lineTo(m+W*cell,m+j*cell);x.stroke();}
  x.fillStyle='#555';x.font=`${Math.floor(cell*0.42)}px system-ui,sans-serif`;
  for(let i=0;i<W;i++)if((i+1)%5===0||i===0){x.fillText(i+1,m+i*cell+cell/2,m/2);x.fillText(i+1,m+i*cell+cell/2,m+H*cell+m/2);}
  for(let j=0;j<H;j++)if((j+1)%5===0||j===0){x.fillText(j+1,m/2,m+j*cell+cell/2);x.fillText(j+1,m+W*cell+m/2,m+j*cell+cell/2);}
  // 图例
  const y0=m*2+H*cell, colW=(cv.width-m*2)/4;
  x.textAlign='left';x.font=`${Math.floor(cell*0.5)}px system-ui,sans-serif`;
  sortedColors().forEach(({p,n},k)=>{
    const cx=m+(k%4)*colW, cy=y0+Math.floor(k/4)*cell*1.4;
    x.fillStyle=p.hex;x.fillRect(cx,cy,cell,cell);x.strokeStyle='#999';x.lineWidth=1;x.strokeRect(cx,cy,cell,cell);
    x.fillStyle='#222';x.fillText(`${p.code} × ${n}`,cx+cell*1.3,cy+cell/2);
  });
  return cv;
}
function drawPreview(cell){
  const {W,H,assign,pal}=result;
  const cv=document.createElement('canvas');cv.width=W*cell;cv.height=H*cell;const x=cv.getContext('2d');
  x.fillStyle='#F1EEE8';x.fillRect(0,0,cv.width,cv.height);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    const a=assign[j*W+i];const cx=i*cell+cell/2,cy=j*cell+cell/2;
    if(a<0){x.fillStyle='#E2DED6';x.beginPath();x.arc(cx,cy,cell*0.12,0,Math.PI*2);x.fill();continue;}
    x.fillStyle=pal[a].hex;x.beginPath();x.arc(cx,cy,cell*0.47,0,Math.PI*2);x.fill();
    x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.arc(cx,cy,cell*0.47,0,Math.PI*2);x.arc(cx,cy,cell*0.4,0,Math.PI*2,true);x.fill();
    x.fillStyle='#F1EEE8';x.beginPath();x.arc(cx,cy,cell*0.16,0,Math.PI*2);x.fill();
  }
  return cv;
}
function draw(){
  const v=$('view'),x=v.getContext('2d');
  let src;
  if(!result&&currentView!=='orig'){v.width=v.height=1;return;}
  if(currentView==='pattern')src=drawPattern(28);
  else if(currentView==='preview')src=drawPreview(20);
  else{const s=Math.min(1,800/srcImg.naturalWidth);src=document.createElement('canvas');src.width=srcImg.naturalWidth*s;src.height=srcImg.naturalHeight*s;src.getContext('2d').drawImage(srcImg,0,0,src.width,src.height);}
  v.width=src.width;v.height=src.height;x.drawImage(src,0,0);
}
function download(name,url){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}

$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{srcImg=img;generate();};img.onerror=()=>msg('这张图读不出来，请换 JPG 或 PNG 再试。');
  img.src=URL.createObjectURL(f);
});
$('sample').addEventListener('click',()=>{const img=makeSample();img.onload=()=>{srcImg=img;generate();};});
$('run').addEventListener('click',generate);
$('palette').addEventListener('change',()=>{if($('palette').value==='custom')$('customBox').open=true;});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  currentView=b.dataset.view;document.querySelectorAll('.tabs button').forEach(o=>o.setAttribute('aria-pressed',o===b));draw();
}));
$('dlPattern').addEventListener('click',()=>{if(!result)return msg('请先生成图纸。');download('拼豆图纸.png',drawPattern(40).toDataURL('image/png'));});
$('dlPreview').addEventListener('click',()=>{if(!result)return msg('请先生成图纸。');download('成品预览.png',drawPreview(24).toDataURL('image/png'));});
$('dlCsv').addEventListener('click',()=>{
  if(!result)return msg('请先生成图纸。');
  const rows=['色号,颜色,颗数,建议备豆'].concat(sortedColors().map(({p,n})=>`${p.code},${p.hex},${n},${Math.ceil(n*1.1)}`));
  download('用量清单.csv',URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'})));
});
// 打开时先载入示例，方便看效果
const s0=makeSample();s0.onload=()=>{srcImg=s0;generate();};
</script>
</body>
